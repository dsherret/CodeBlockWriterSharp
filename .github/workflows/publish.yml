name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # enables GitHub OIDC token issuance for nuget.org trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches version
        run: |
          version=$(dotnet msbuild CodeBlockWriterSharp/CodeBlockWriterSharp.csproj -getProperty:Version)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version."
            exit 1
          fi
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack CodeBlockWriterSharp/CodeBlockWriterSharp.csproj --configuration Release --output artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: NuGet push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
